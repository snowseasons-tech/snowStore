[tool.poetry]
name = "documentation-platform"
version = "0.1.0"
description = "Documentation engine and portal API for Snow Seasons Tech"
authors = ["Snow Seasons Tech"]

[tool.poetry.dependencies]
python = "^3.10"
pyyaml = "^6.0"
jinja2 = "^3.1"
