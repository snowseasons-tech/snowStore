product:
  id: cdot-stations
  name: CDOT Stations
  company: Snow Seasons Tech
  category: SaaS
  status: early_access
  version: 0.1.0

  description: >
    A dashboard for accessing and
    monitoring Colorado transportation
    station information.

  features:
    - Station dashboard
    - Station search
    - Monitoring interface
    - Account-based access

  documentation:
    generate:
      - product_overview
      - getting_started
      - user_manual
      - faq
      - release_notes

  billing:
    provider: stripe
    pricing_source: stripe
    product_id: null

  access:
    authentication_required: true
    entitlement: cdot_stations_access

  support:
    level: standard
