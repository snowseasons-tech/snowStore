name: Deploy Documentation Site

on:
  push:
    branches:
      - main
    paths:
      - 'documentation_platform/docs-site/**'
      - 'documentation_platform/generator/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: documentation_platform/docs-site/docs-site/package-lock.json

      - name: Install Dependencies
        run: |
          cd documentation_platform/docs-site/docs-site
          npm install

      - name: Build Website
        run: |
          cd documentation_platform/docs-site/docs-site
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./documentation_platform/docs-site/docs-site/build
