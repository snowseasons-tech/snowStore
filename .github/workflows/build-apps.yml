name: Build apps

on:
  pull_request:
    paths:
      - '.github/workflows/build-apps.yml'
      - 'scripts/build-apps.sh'
      - 'launcher/**'
      - 'Blogen/**'
      - 'Lead-Pipeline/**'
      - 'products/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: scripts/build-apps.sh

  social-studio-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: social-studio-test-only
          MYSQL_DATABASE: social_studio_test_ci
          MYSQL_USER: studio
          MYSQL_PASSWORD: social-studio-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psocial-studio-test-only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    defaults:
      run:
        working-directory: products/social-studio
    env:
      SOCIAL_STUDIO_TEST_DATABASE_URL: mysql+pymysql://studio:social-studio-test-only@127.0.0.1:3306/social_studio_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/frontend.test.cjs
