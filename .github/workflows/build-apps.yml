name: Build apps

on:
  pull_request:
    paths:
      - '.github/workflows/build-apps.yml'
      - 'scripts/build-apps.sh'
      - 'launcher/**'
      - 'Blogen/**'
      - 'Lead-Pipeline/**'
      - 'products/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-apps.sh
