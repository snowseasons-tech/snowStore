[project]
name = "snow-seasons-docs"
version = "0.1.0"
description = "Documentation Engine for Snow Seasons Tech"
dependencies = [
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "markdown>=3.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
