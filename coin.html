<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnowSeasonsTech Digital Coin</title>
<link rel="preload" as="image" href="img/snowseasonstech-coin.webp" type="image/webp">
<style>
  :root { --size: min(70vmin, 420px); --thick: 18px; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, #0b3552 0%, #041626 70%);
  }
  .stage { perspective: 1400px; }
  .coin {
    position: relative; width: var(--size); height: var(--size);
    transform-style: preserve-3d;
    animation: spin 16s linear infinite, bob 5s ease-in-out infinite;
  }
  .face, .slice {
    position: absolute; inset: 0; border-radius: 50%;
    backface-visibility: hidden;
  }
  .face {
    background: url(img/snowseasonstech-coin.webp) 50% 50% / 114% no-repeat;
    clip-path: circle(49.5%);
  }
  /* pulsing cyan circuitry: same art, contrast-boosted so only the bright cyan survives, screened on top */
  .face::before, .face::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
  .face::before {
    background: inherit; clip-path: inherit;
    filter: brightness(.6) contrast(3.5) saturate(3);
    mix-blend-mode: screen;
    animation: pulse 2.4s ease-in-out infinite;
  }
  /* shimmering metal: a soft highlight band sweeping across */
  .face::after {
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.5) 50%, transparent 62%) 150% 0 / 260% 100% no-repeat;
    mix-blend-mode: soft-light;
    animation: shimmer 4s ease-in-out infinite;
  }
  .front { transform: translateZ(calc(var(--thick) / 2)); }
  .back  { transform: rotateY(180deg) translateZ(calc(var(--thick) / 2)); }
  .slice {
    backface-visibility: visible;
    background: linear-gradient(135deg, #e8f1f7, #8fa3b0 50%, #cfe0ea);
    transform: translateZ(calc(var(--i) * var(--thick) / 11 - var(--thick) / 2));
  }
  .glow { position: absolute; inset: -6%; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,229,255,.25), transparent 65%);
    transform: translateZ(-30px); filter: blur(20px); }
  .shadow {
    position: absolute; left: 50%; bottom: -14%; width: 55%; height: 6%;
    transform: translateX(-50%); border-radius: 50%;
    background: rgba(0,200,255,.35); filter: blur(18px);
    animation: shadow 3s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotateY(360deg); } }
  @keyframes pulse { 0%,100% { opacity: .15; } 50% { opacity: .75; } }
  @keyframes shimmer { 0% { background-position: 150% 0; } 60%,100% { background-position: -50% 0; } }
  @keyframes bob { 50% { margin-top: -18px; } }
  @keyframes shadow { 50% { transform: translateX(-50%) scale(.8); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .coin, .shadow, .face::before, .face::after { animation: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="coin" role="img" aria-label="SnowSeasonsTech digital coin, rotating">
    <div class="slice" style="--i:0"></div><div class="slice" style="--i:1"></div>
    <div class="slice" style="--i:2"></div><div class="slice" style="--i:3"></div>
    <div class="slice" style="--i:4"></div><div class="slice" style="--i:5"></div>
    <div class="slice" style="--i:6"></div><div class="slice" style="--i:7"></div>
    <div class="slice" style="--i:8"></div><div class="slice" style="--i:9"></div>
    <div class="slice" style="--i:10"></div><div class="slice" style="--i:11"></div>
    <div class="face front"></div>
    <div class="face back"></div>
  </div>
  <div class="shadow"></div>
</div>
</body>
</html>
