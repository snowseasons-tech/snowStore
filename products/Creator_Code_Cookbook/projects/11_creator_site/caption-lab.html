<h1>Caption lab</h1><p>A personal writing-budget tool. Nothing is sent or saved.</p>
<label for="caption">Draft caption</label>
<!-- maxlength is only a generous UI bound; it uses UTF-16 units, unlike our counter. -->
<textarea id="caption" rows="6" maxlength="10000" aria-describedby="count-note" placeholder="Write a fictional caption..."></textarea>
<p id="count-note">The counter uses Unicode code points. Some emoji and combined characters count as several. Your chosen platform may count text differently.</p>
<button id="clear-caption" type="button">Clear caption</button><p id="caption-result" role="status"></p>
