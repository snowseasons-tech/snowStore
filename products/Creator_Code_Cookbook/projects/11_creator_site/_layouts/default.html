<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} | {{ site.title | escape }}</title>
<link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}"></head><body>
{% include header.html %}
<main id="main-content">{{ content }}</main>
<footer><p>Fictional creator coding practice by Snow Seasons Tech</p></footer>
<!-- Liquid chooses scripts at build time; the script runs later in the browser. -->
{% if page.caption_tool %}<script src="{{ '/assets/caption.js' | relative_url }}" defer></script>{% endif %}
</body></html>
