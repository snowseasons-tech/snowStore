<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator posting checklist</title><link rel="stylesheet" href="styles.css"><script src="checklist.js" defer></script>
</head><body><main><h1>Before you share</h1>
<p>A personal practice checklist. Checking a box does not publish anything.</p>
<fieldset><legend>Review your draft</legend>
<label><input id="idea" type="checkbox"> Is the idea clear and the media yours to share?</label>
<label><input id="caption" type="checkbox"> Did you review the caption and remove private details?</label>
<label><input id="alt-text" type="checkbox"> Did you prepare useful alt text or captions where appropriate?</label>
</fieldset><button id="clear-tasks" type="button">Clear completed tasks</button>
<p id="storage-status" role="status">Loading checklist.</p>
<noscript>JavaScript is needed to save checklist states. Native checkboxes alone do not save them.</noscript>
</main></body></html>
