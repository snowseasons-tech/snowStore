<!doctype html>
<!-- STARTER: follow LESSON.md and edit your own copy. -->
<!-- The doctype selects modern HTML rendering. -->
<html lang="en">
<head>
  <!-- UTF-8 supports common text characters; viewport supports small screens. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- EDIT HERE: title is the browser tab label, not the on-page heading. -->
  <title>Practice Cleaning Co services</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- header introduces the page. Use a clear main heading for this lesson. -->
  <header><h1>Practice Cleaning Co</h1><p>Fictional cleaning services for this lesson.</p></header>
  <!-- main contains the primary content. Nest headings in a sensible order. -->
  <main>
    <section>
      <h2>Our services</h2>
      <!-- ul groups an unordered list; each item belongs inside an li. -->
      <ul>
        <!-- PRACTICE: change these service names and add a third li. -->
        <li>Office cleaning</li>
        <li>Move out cleaning</li>
      </ul>
    </section>
    <section>
      <h2>Contact</h2>
      <!-- href is an attribute. mailto asks an installed mail app to compose. -->
      <!-- This example address is fictional and does not deliver real requests. -->
      <p><a href="mailto:hello@practice.example">Email our practice business</a></p>
    </section>
  </main>
  <footer><p>Training example by Snow Seasons Tech</p></footer>
</body>
</html>
