<!doctype html>
<!-- Jekyll replaces Liquid expressions and includes while building the site. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- escape keeps text values from being interpreted as HTML markup. -->
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <!-- relative_url adds baseurl for sites hosted under a project subpath. -->
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main-content">Skip to main content</a>
  {% include header.html %}
  <main id="main-content">{{ content }}</main>
  <footer><p>Fictional learning project by Snow Seasons Tech. No bookings or payments.</p></footer>
  <!-- Only the calculator page loads its scripts, in dependency order. -->
  {% if page.calculator %}
    <script src="{{ '/assets/js/quote.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
