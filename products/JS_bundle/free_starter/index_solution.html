<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice service price</title>
  <link rel="stylesheet" href="styles.css">
  <!-- defer waits until HTML parsing is complete before running the script. -->
  <script src="app_solution.js" defer></script>
</head>
<body>
  <header><h1>Practice Service Co</h1><p>A fictional pricing demonstration.</p></header>
  <main>
    <!-- A real button provides native keyboard activation. -->
    <button id="show-price" type="button">Show practice rate</button>
    <!-- role status announces updated text without moving keyboard focus. -->
    <p id="price-result" role="status">Choose the button to see the rate.</p>
    <noscript>Enable JavaScript to use this practice button.</noscript>
  </main>
</body>
</html>
