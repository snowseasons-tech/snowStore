<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice opening checklist</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Small office opening checklist</h1>
  <p>Fictional daily procedure. Checkboxes are a local practice interface, not an audit log.</p>
  <!-- fieldset groups related controls; legend names the group. -->
  <fieldset>
    <legend>Before opening</legend>
    <!-- Nested label gives each checkbox a readable, clickable name. -->
    <p><label><input type="checkbox"> Check the day's appointments</label></p>
    <p><label><input type="checkbox"> Inspect the customer area</label></p>
    <p><label><input type="checkbox"> Prepare supplies</label></p>
  </fieldset>
  <!-- Native disclosure works without JavaScript. -->
  <details><summary>How should we record completion?</summary>
    <p>This lesson does not store completion. A production process needs a reviewed recordkeeping design.</p>
  </details>
</main>
</body>
</html>
