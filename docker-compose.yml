services:
  portal_api:
    build: .
    ports:
      - "8081:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_TEST_MODE=false
      - ALLOW_LIVE=1
      - DATABASE_URL=postgresql://user:pass@prod-db-host:5432/snowstore
      - STRIPE_API_KEY=${STRIPE_API_KEY:?Set STRIPE_API_KEY in .env}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
    volumes:
      - .:/app
    restart: always
