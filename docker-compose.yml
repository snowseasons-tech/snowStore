services:
  portal_api:
    build: .
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_TEST_MODE=${API_TEST_MODE:-false}
      - ALLOW_LIVE=${ALLOW_LIVE:-0}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - STRIPE_API_KEY=${STRIPE_API_KEY:?Set STRIPE_API_KEY in .env}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
    restart: unless-stopped
