<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Manrope'; src: url('../../../img/fonts/manrope-latin-variable.woff2') format('woff2'); font-weight: 400 800; }
  @font-face { font-family: 'Source Sans 3'; src: url('../../../img/fonts/source-sans-3-latin-variable.woff2') format('woff2'); font-weight: 400 700; }
  :root { --bg: #070d19; --card: #152035; --line: #34516d; --text: #edf4ff; --muted: #b4c3d5; --ice: #74dbff; --accent: #8adfff; --warm: #ffb547; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 80% 15%, #12385a 0%, transparent 45%), radial-gradient(circle at 10% 95%, #0f2b48 0%, transparent 40%), var(--bg);
    color: var(--text); font-family: 'Source Sans 3', sans-serif; position: relative;
  }
  .dots { position: absolute; width: 120px; height: 120px; background-image: radial-gradient(#2c5a85 2.5px, transparent 2.5px); background-size: 24px 24px; opacity: .7; }
  .frame { position: absolute; inset: 90px 90px 150px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-family: 'Manrope'; font-weight: 700; font-size: 30px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice); margin-bottom: 28px; }
  h1 { font-family: 'Manrope'; font-weight: 800; font-size: 92px; line-height: 1.02; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: var(--ice); }
  .sub { font-size: 40px; line-height: 1.3; color: var(--muted); margin-top: 32px; max-width: 880px; }
  .pills { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 52px; }
  .pill { border: 2px solid var(--line); background: rgba(21,32,53,.85); border-radius: 18px; padding: 16px 26px; font-family: 'Manrope'; font-weight: 700; font-size: 30px; display: flex; align-items: center; gap: 14px; }
  .pill i { width: 16px; height: 16px; border-radius: 50%; background: var(--ice); display: inline-block; }
  .list { list-style: none; margin-top: 44px; display: grid; gap: 22px; }
  .list li { display: flex; gap: 26px; align-items: center; background: rgba(21,32,53,.85); border: 2px solid var(--line); border-radius: 20px; padding: 22px 30px; font-size: 38px; font-weight: 600; }
  .list .n { flex: none; width: 62px; height: 62px; border-radius: 16px; background: #0e2a44; color: var(--ice); font-family: 'Manrope'; font-weight: 800; font-size: 34px; display: grid; place-items: center; }
  .list .box { flex: none; width: 46px; height: 46px; border: 4px solid var(--ice); border-radius: 10px; }
  .list small { display: block; font-size: 28px; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .cta { margin-top: 48px; display: inline-flex; align-self: flex-start; background: var(--accent); color: #061223; font-family: 'Manrope'; font-weight: 800; font-size: 34px; padding: 22px 38px; border-radius: 18px; }
  .footer { position: absolute; left: 0; right: 0; bottom: 58px; display: flex; justify-content: center; align-items: center; gap: 16px; font-family: 'Manrope'; font-weight: 600; font-size: 26px; letter-spacing: .24em; color: #7f9fc4; }
  .footer svg { width: 40px; height: 40px; }
  .big-mark { position: absolute; right: -80px; top: 140px; width: 560px; height: 560px; opacity: .13; }
  .center { align-items: center; text-align: center; }
  .center .sub { margin-left: auto; margin-right: auto; }
  .center .pills { justify-content: center; }
  .shot { margin-top: 44px; width: 100%; height: 400px; object-fit: cover; border-radius: 28px; border: 2px solid var(--line); box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .link { margin-top: 26px; font-family: 'Manrope'; font-weight: 800; font-size: 34px; color: var(--ice); }
  .bars { margin-top: 44px; height: 360px; display: flex; align-items: flex-end; gap: 26px; padding: 30px 40px 0; background: rgba(21,32,53,.85); border: 2px solid var(--line); border-radius: 28px; }
  .bars div { flex: 1; border-radius: 14px 14px 0 0; background: linear-gradient(#8adfff, #1e5f8f); }
  .bars .hi { background: linear-gradient(#ffb547, #8a5a1c); }
  .labels { display: flex; gap: 26px; padding: 0 40px; margin-top: 16px; font-family: 'Manrope'; font-weight: 700; font-size: 26px; color: var(--muted); }
  .labels span { flex: 1; text-align: center; }
</style>
</head>
<body>
<div class="dots" style="left:60px;top:60px"></div>
<div class="dots" style="right:60px;bottom:170px"></div>
<div id="root"></div>
<div class="footer">
  <svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#e5f4ff"/><path d="M20 7v26M9 13l22 14M9 27l22-14m-15-3 4 4 4-4m-8 20 4-4 4 4M9 18l5-1-1-5m18 10-5 1 1 5M9 22l5 1-1 5m18-10-5-1 1-5" stroke="#1466a1" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  SNOW SEASONS TECH
</div>
<script>
const mark = '<svg class="big-mark" viewBox="0 0 40 40"><path d="M20 7v26M9 13l22 14M9 27l22-14m-15-3 4 4 4-4m-8 20 4-4 4 4M9 18l5-1-1-5m18 10-5 1 1 5M9 22l5 1-1 5m18-10-5-1 1-5" stroke="#9bdcfc" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>';
const pills = a => `<div class="pills">${a.map(t => `<span class="pill"><i></i>${t}</span>`).join('')}</div>`;
const shot = (file, alt) => `<img class="shot" src="../../../_assets/images/${file}" alt="${alt}">`;
const posts = {
  'new-year-plan': `${mark}<div class="frame">
    <div class="eyebrow">New year, 2027</div>
    <h1>Set up your business tech for <em>2027</em></h1>
    <ul class="list">
      <li><span class="box"></span>Renew your domain early</li>
      <li><span class="box"></span>Check your Google profile</li>
      <li><span class="box"></span>Back up your site</li>
      <li><span class="box"></span>Pick one task to automate</li>
    </ul></div>`,
  'gbp-posts': `${mark}<div class="frame">
    <div class="eyebrow">Google Business Profile</div>
    <h1>Post on your profile <em>every week</em></h1>
    <p class="sub">Active profiles give customers a reason to pick you. One photo, a short update and a button takes about five minutes.</p>
    ${pills(['Photo', 'Update', 'Button'])}</div>`,
  'inventory-tracker': `<div class="frame">
    <div class="eyebrow">Store Inventory Tracker</div>
    <h1>Start the year with a <em>real stock count</em></h1>
    <p class="sub">Know what's on the shelf and what to reorder before it runs out.</p>
    ${shot('inventory-tracker.jpeg', 'Store Inventory Tracker')}
    <div class="link">snowseasonstech.store</div></div>`,
  'batch-posting': `${mark}<div class="frame">
    <div class="eyebrow">Social media tip</div>
    <h1>Batch your posts in <em>one hour</em> a week</h1>
    <ul class="list">
      <li><span class="n">1</span><div>Pick three topics<small>One product, one tip, one customer story</small></div></li>
      <li><span class="n">2</span><div>Write three captions<small>Short, plain and in your own voice</small></div></li>
      <li><span class="n">3</span><div>Schedule them<small>Then go back to running the business</small></div></li>
    </ul></div>`,
  'invoice-biller': `<div class="frame">
    <div class="eyebrow">Tax season is coming</div>
    <h1>Clean invoices, <em>clean books</em></h1>
    <p class="sub">Invoice &amp; Biller makes a professional invoice in about a minute. No account, no subscription.</p>
    ${shot('invoice-generator.jpeg', 'Invoice & Biller')}
    <div class="link">snowseasonstech.store</div></div>`,
  'website-care': `${mark}<div class="frame">
    <div class="eyebrow">Website care</div>
    <h1>Updates, uptime and security, <em>handled</em></h1>
    ${pills(['Updates', 'Uptime monitoring', 'Security', 'Basic SEO'])}
    <span class="cta">Message us: info@snowseasonstech.net</span></div>`,
  'lead-pipeline': `<div class="frame">
    <div class="eyebrow">Lead Generation Pipeline</div>
    <h1>Your Q1 leads, <em>in one place</em></h1>
    <p class="sub">Collect, score and organize every lead, so each morning starts with a call list.</p>
    ${shot('Leadgen.jpeg', 'Lead Generation Pipeline')}
    <div class="link">snowseasonstech.store</div></div>`,
  'review-replies': `${mark}<div class="frame">
    <div class="eyebrow">Google reviews</div>
    <h1>Reply to every <em>review</em></h1>
    <ul class="list">
      <li><span class="n">1</span><div>Thank happy customers by name<small>It shows future customers someone is listening</small></div></li>
      <li><span class="n">2</span><div>Answer complaints calmly<small>Then take the detail offline</small></div></li>
      <li><span class="n">3</span><div>Keep replies short<small>Three sentences is plenty</small></div></li>
    </ul></div>`,
  'auto-scheduler': `<div class="frame">
    <div class="eyebrow">Auto Scheduler</div>
    <h1>Let customers book <em>their own</em> time</h1>
    <p class="sub">Open slots, no back-and-forth texts. Built for salons, tutors, repair shops and consultants.</p>
    ${shot('booking-app.jpeg', 'Auto Scheduler')}
    <div class="link">snowseasonstech.store</div></div>`,
  'auto-blogger': `<div class="frame">
    <div class="eyebrow">Auto Blogger</div>
    <h1>Keep your blog <em>moving</em> all year</h1>
    <p class="sub">Drafts are built for you in Hugo, WordPress or Ghost. You read them, then publish.</p>
    ${shot('bloggen.jpeg', 'Auto Blogger')}
    <div class="link">snowseasonstech.store</div></div>`,
  'gbp-photos': `${mark}<div class="frame">
    <div class="eyebrow">Google Business Profile tip</div>
    <h1>Fresh photos get <em>more looks</em></h1>
    <p class="sub">Add a new photo of your work, team or storefront every month. Recent photos show customers you're open for business.</p>
    ${pills(['Your work', 'Your team', 'Your space'])}</div>`,
  'gbp-analytics': `<div class="frame">
    <div class="eyebrow">Month-end check</div>
    <h1>Read your Google numbers <em>in one view</em></h1>
    <p class="sub">The GBP Analytics Dashboard turns your profile reports into clear charts.</p>
    <div class="bars"><div style="height:38%"></div><div style="height:52%"></div><div style="height:46%"></div><div style="height:64%"></div><div style="height:58%"></div><div class="hi" style="height:86%"></div></div>
    <div class="labels"><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span><span>Jan</span></div>
    <div class="link">Illustration · Not affiliated with Google</div></div>`,
};
document.getElementById('root').innerHTML = posts[location.hash.slice(1)] || 'unknown post';
</script>
</body>
</html>
